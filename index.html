<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Rillis | Frontpage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="js/tailwind.js"></script>
    <link rel="icon" type="image/x-icon" href="img/favicon2.ico">
  </head>
  <body class="bg-gray-900 text-gray-100 min-h-screen font-sans selection:bg-blue-500 selection:text-white flex flex-col">

    <!-- Conteúdo Centralizado (Splash Screen) -->
    <main class="flex-grow flex flex-col justify-center items-center px-6">
        <div class="text-center">
            <!-- Título -->
            <h1 class="text-6xl md:text-8xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-4 tracking-tight">
                Rillis
            </h1>
            
            <!-- Subtítulo -->
            <p class="text-lg md:text-2xl text-gray-400 mb-12 font-light">
                Projetos & Repositórios
            </p>

            <!-- Links (Ribbon) -->
            <div class="flex flex-col sm:flex-row justify-center items-center gap-4 sm:gap-8 text-lg md:text-xl font-medium">
                <a href="https://portfolio.rillis.com.br" class="text-gray-300 hover:text-emerald-400 hover:scale-105 transition-all duration-200">
                    Portfolio
                </a>
                
                <span class="text-gray-700 hidden sm:inline select-none">|</span>
                
                <a href="https://github.com/rillis" target="_blank" class="text-gray-300 hover:text-blue-400 hover:scale-105 transition-all duration-200">
                    GitHub
                </a>
                
                <span class="text-gray-700 hidden sm:inline select-none">|</span>
                
                <a href="https://linkedin.com/in/rillis" target="_blank" class="text-gray-300 hover:text-blue-500 hover:scale-105 transition-all duration-200">
                    LinkedIn
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 border-t border-gray-800 text-center text-gray-500 text-sm">
      Made by Rillis © 2022 - <span id="ano-atual"></span>
    </footer>

    <script>
        document.getElementById('ano-atual').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
